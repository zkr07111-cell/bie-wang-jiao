<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>更新别忘交</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;background:#f6f7f9;color:#111827;display:grid;place-items:center;min-height:100vh;margin:0}.box{background:#fff;padding:28px;border-radius:20px;max-width:360px;text-align:center;box-shadow:0 8px 30px #00000012}.muted{color:#6b7280;font-size:14px;line-height:1.6}</style></head><body><div class="box"><h2>正在更新「别忘交」</h2><div class="muted" id="msg">正在清理旧版本缓存，请稍候…</div></div><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)))}document.getElementById('msg').textContent='更新完成，正在打开最新版…';setTimeout(()=>location.replace('./index.html?v=6'),800)}catch(e){document.getElementById('msg').textContent='自动更新未完全成功，请关闭此页面后重新打开网站。'}})();</script></body></html>
